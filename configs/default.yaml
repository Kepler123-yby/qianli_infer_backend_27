pipeline:
  processing:
    preprocess:
      implementation: cuda
      center_padding: true
      padding_color: [124, 124, 124]
      normalize_scale: 0.00392156862745098

    postprocess: # 固定使用CPU
      decoder: yolo_v8
      confidence_threshold: 0.5
      nms_threshold: 0.45

  inference:
    model_path: assets/armor_v8n_fp16.engine
    type: tensorrt
    mode: async
    capacity: 1
    worker: 1
    tensorrt:
      device_id: 0
