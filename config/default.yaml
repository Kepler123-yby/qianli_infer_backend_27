pipeline:
  model:
    name: yolov8
    path: models/onnx/Infantry-v8n-fp16-20260726-D1.8w-B16.engine

  processing:
    preprocess:
      implementation: cuda
      center_padding: true
      padding_color: [124, 124, 124]
      normalize_scale: 0.00392156862745098

    postprocess:
      implementation: cuda
      confidence_threshold: 0.5
      nms_threshold: 0.45

  inference:
    type: tensorrt
    tensorrt:
      device_id: 0

  execution:
    mode: async
    input_capacity: 1
    result_capacity: 1
    overflow: drop_oldest
